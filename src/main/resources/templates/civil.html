<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>민원 처리 현황 - 공공기관 시스템 운영 현황</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="wrapper">
    <aside th:replace="~{layout :: sidebar('civil')}"></aside>

    <div class="main-content">
        <div class="top-bar">
            <span class="top-bar-title">민원 처리 현황</span>
            <div class="top-bar-right">
                <span class="top-bar-user" th:text="${username} + ' 님'"></span>
                <form th:action="@{/logout}" method="post" style="margin:0">
                    <button class="btn-logout" type="submit">로그아웃</button>
                </form>
            </div>
        </div>

        <div class="page-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">전체 민원</div>
                    <div class="stat-value" th:text="${complaints.size()}">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">완료</div>
                    <div class="stat-value success" th:text="${completedCount}">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">처리중·접수</div>
                    <div class="stat-value" th:text="${pendingCount}">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">반려</div>
                    <div class="stat-value danger" th:text="${rejectedCount}">0</div>
                </div>
            </div>

            <div class="data-card">
                <div class="data-card-header">
                    <h3>민원 처리 결과 목록</h3>
                    <a th:href="@{/civil/excel}" class="btn-excel">엑셀 다운로드</a>
                </div>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>접수번호</th>
                                <th>민원종류</th>
                                <th>접수일</th>
                                <th>상태</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="complaint, stat : ${complaints}">
                                <td th:text="${stat.count}" class="num-gray"></td>
                                <td th:text="${complaint.receiptNumber}"></td>
                                <td th:text="${complaint.complaintType}"></td>
                                <td th:text="${#temporals.format(complaint.receiptDate, 'yyyy-MM-dd')}"></td>
                                <td>
                                    <span th:class="${complaint.status == '완료'} ? 'badge badge-success' :
                                                   (${complaint.status == '반려'} ? 'badge badge-danger' : 'badge badge-warning')"
                                          th:text="${complaint.status}"></span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
