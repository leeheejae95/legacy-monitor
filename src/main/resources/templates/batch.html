<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배치 처리 결과 - 공공기관 시스템 운영 현황</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="wrapper">
    <aside th:replace="~{layout :: sidebar('batch')}"></aside>

    <div class="main-content">
        <div class="top-bar">
            <span class="top-bar-title">배치 처리 결과</span>
            <div class="top-bar-right">
                <span class="top-bar-user" th:text="${username} + ' 님'"></span>
                <form th:action="@{/logout}" method="post" style="margin:0">
                    <button class="btn-logout" type="submit">로그아웃</button>
                </form>
            </div>
        </div>

        <div class="page-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">전체 배치</div>
                    <div class="stat-value" th:text="${results.size()}">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">정상</div>
                    <div class="stat-value success" th:text="${normalCount}">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">오류</div>
                    <div class="stat-value danger" th:text="${errorCount}">0</div>
                </div>
            </div>

            <div class="data-card">
                <div class="data-card-header">
                    <h3>배치 처리 결과 목록</h3>
                    <a th:href="@{/batch/excel}" class="btn-excel">엑셀 다운로드</a>
                </div>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>날짜</th>
                                <th>배치명</th>
                                <th>처리건수</th>
                                <th>성공</th>
                                <th>실패</th>
                                <th>상태</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="result, stat : ${results}">
                                <td th:text="${stat.count}" class="num-gray"></td>
                                <td th:text="${#temporals.format(result.batchDate, 'yyyy-MM-dd')}"></td>
                                <td th:text="${result.batchName}"></td>
                                <td class="num-total"
                                    th:text="${#numbers.formatInteger(result.totalCount, 0, 'COMMA')}"></td>
                                <td class="num-success"
                                    th:text="${#numbers.formatInteger(result.successCount, 0, 'COMMA')}"></td>
                                <td th:class="${result.failCount > 0} ? 'num-fail' : 'num-gray'"
                                    th:text="${result.failCount > 0} ? ${#numbers.formatInteger(result.failCount, 0, 'COMMA')} : '-'"></td>
                                <td>
                                    <span th:class="${result.status == '정상'} ? 'badge badge-success' : 'badge badge-danger'"
                                          th:text="${result.status}"></span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
