<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 공공기관 시스템 운영 현황</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-page">
    <div class="login-box">
        <div class="login-header">
            <div class="login-emblem"><span>G</span></div>
            <h2>공공기관 시스템<br>운영 현황 관리</h2>
            <p>관리자 전용 시스템</p>
        </div>

        <div class="alert alert-error" th:if="${param.error}">
            아이디 또는 비밀번호가 올바르지 않습니다.
        </div>
        <div class="alert alert-success" th:if="${param.logout}">
            로그아웃되었습니다.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label class="form-label" for="username">아이디</label>
                <input class="form-control" type="text" id="username" name="username"
                       placeholder="아이디를 입력하세요" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">비밀번호</label>
                <input class="form-control" type="password" id="password" name="password"
                       placeholder="비밀번호를 입력하세요" autocomplete="current-password" required>
            </div>
            <button class="btn-login" type="submit">로그인</button>
        </form>
    </div>
</div>
</body>
</html>
